; Read by golfVs at startup from beside the binary, on top of the settings baked
; into golfVs.pck. Godot loads an `override.cfg` from the executable's directory
; in every exported build; nothing here is Pi-specific machinery.
;
; tools/build.sh copies this next to the Linux arm64 binary, which exists for
; the Raspberry Pi 5. The Pi's Vulkan driver (V3DV) is conformant and the Mobile
; renderer starts on it, but the GPU is a phone-class part and glow is a blur
; chain at window resolution; the Compatibility renderer is the one expected to
; be playable. Provisional until somebody has measured both on a Pi -- delete
; this file (or rename it) to start the same build on Forward Mobile.
;
; The same line, on any machine whose only Vulkan device is llvmpipe (a VM, or a
; desktop without a Vulkan driver), is the difference between a crash inside the
; software driver's shader compiler and a game.

[rendering]

renderer/rendering_method="gl_compatibility"
