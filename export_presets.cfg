; golfVs export presets.
;
; Tracked on purpose, and it used to be ignored. The reason it was ignored --
; "it carries local keystore paths" -- is avoidable rather than inherent: the
; keystore fields below are left empty, and `tools/build.sh` supplies them
; through the GODOT_ANDROID_KEYSTORE_DEBUG_* environment variables Godot reads
; for exactly this purpose. Nothing here is a secret and nothing here is a path
; that only exists on one machine.
;
; A build that cannot be reproduced from the repository is not a build, it is a
; souvenir. ADR-002 makes GitHub releases the canonical distribution, and a
; release needs a preset a runner can read.
;
; Release signing is deliberately absent. Debug builds are what M0 owes; a
; release keystore is a secret, belongs in CI secrets, and gets its own decision
; when there is something to release.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; The workshop does not ship. gdUnit4 alone is 2.1 MB of source against 355 KB
; of game, the probes under tools/ are runnable dev scenes, and none of it does
; anything for a player. Excluded rather than deleted: they are how the thing is
; built, they just are not part of the thing.
;
; `build/*` is the launcher-icon renders `tools/make_icons.gd` writes before every
; export. They sit under res:// so the exporter imported and packed them --
; twenty entries, 45 KB, 14 % of the pack -- from ADR-025 until the first release
; validation read the pack's directory and noticed. An icon is not part of the game.
; `build/.gdignore` now keeps the editor from importing that directory at all
; (no `.import` sidecars, no reimport on every `--import`); this entry stays as
; the second line, because the exporter's filter is what a reviewer reads.
;
; The boot splash is excluded on purpose and still ships: the exporter adds
; `boot_splash/image` to the pack by itself, and without this exclusion it
; arrived twice -- once as a file, once as the splash -- which is 98 KB of
; loading screen paid for two times in a 234 KB game. Measured, not assumed.
exclude_filter="addons/gdUnit4/*, tests/*, tools/*, docs/*, *.md, reports/*, build/*, art/icon/boot_splash.png"
export_path="build/windows/golfVs.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=true
; Generated from icon.svg by tools/make_icons.gd and committed, because
; Windows wants an .ico and an .ico cannot be text. Applying it needs rcedit,
; which tools/build.sh fetches; without rcedit the executable keeps the icon
; baked into Godot's own template, which is Godot's logo.
application/icon="res://art/icon/golfVs.ico"
application/console_wrapper_icon="res://art/icon/golfVs.ico"
application/icon_interpolation=4
; Numerals and periods only. Left empty, Godot falls back to the project's
; `config/version`, which may carry a milestone tag ("0.0.1-m0" once did) that
; Windows will not accept -- four warnings per export, about a thing that is not
; wrong. tools/check_version_consistency.py holds these to the same number.
application/file_version="0.0.3"
application/product_version="0.0.3"
application/company_name="golfVs"
application/product_name="golfVs"
application/file_description="golfVs — arcade physics golf with asymmetric defense"
application/copyright="Apache-2.0 (code), CC-BY-4.0 (art/audio)"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false

[preset.1]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="addons/gdUnit4/*, tests/*, tools/*, docs/*, *.md, reports/*, build/*, art/icon/boot_splash.png"
export_path="build/android/golfVs.apk"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

; The prebuilt template APK, not a Gradle build. It needs no Android SDK and no
; JDK, which is most of why an M0 device build has been "blocked on hardware"
; for longer than it had to be. A Gradle build becomes necessary when a plugin
; or a custom manifest does; nothing here needs one yet.
gradle_build/use_gradle_build=false

; ADR-007 makes touch the reference input and a phone the reference device.
; arm64 only: every phone worth testing on has been 64-bit for years, and the
; second architecture doubles the APK for nobody.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86_64=false

; Blank on purpose -- supplied by GODOT_ANDROID_KEYSTORE_DEBUG_* at build time.
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""

version/code=3
; Numerals and periods only -- Android rejects anything else; a milestone tag on
; the project version, if there is one, stays in project.godot.
version/name="0.0.3"

; **Provisional.** DESIGN.md §10 still has the name as an open question and says
; the Android package ID must be final by M4 -- once a build is on a store or a
; phone, changing it is an uninstall. `.test` is in it so that this one cannot be
; mistaken for the real thing.
package/unique_name="org.golfvs.test"
package/name="golfVs"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false

; Left empty, Android falls back to the icon baked into Godot's export
; template, which is Godot's logo -- so these being set is the whole of the fix.
; SVG rather than PNG on purpose: `.gitattributes` sends every PNG through Git
; LFS, and the LFS path has never been proven end to end (Lane F's first task).
; An icon is not worth being the file that discovers LFS is misconfigured.
launcher_icons/main_192x192="res://icon.svg"
launcher_icons/adaptive_foreground_432x432="res://art/icon/adaptive_foreground.svg"
launcher_icons/adaptive_background_432x432="res://art/icon/adaptive_background.svg"
launcher_icons/adaptive_monochrome_432x432=""

graphics/opengl_debug=false

xr_features/xr_mode_index=0

screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

; The game is offline by default (Pillar 4) and writes only to user://. It asks
; for nothing, and the permission list staying empty is a property worth being
; able to point at rather than a default nobody checked.
permissions/internet=false

; ---------------------------------------------------------------------------
; Linux and macOS. Added when CI went cross-platform.
;
; RELEASE.md said these were "absent because nobody has run one, not because
; anything stops them" -- and that was exactly right: the templates ship with
; the engine, so each cost one preset and no new tooling. Both are debug builds
; like the other two; ADR-025's reasoning about release signing is unchanged and
; the release keystore is still its own decision.
;
; Only the options whose default is wrong for this project are written out.
; Godot fills the rest from the platform's own defaults, and a preset that lists
; every key is a preset that goes stale silently when the engine adds one.

[preset.2]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; The same exclusion as the other two presets, for the same reason (ADR-025):
; the workshop is how the thing is built, not part of the thing.
exclude_filter="addons/gdUnit4/*, tests/*, tools/*, docs/*, *.md, reports/*, build/*, art/icon/boot_splash.png"
export_path="build/linux/golfVs.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

binary_format/embed_pck=false
; Desktop GPUs sample S3TC/BPTC natively. The Android preset's ETC2/ASTC comes
; through the same import (project.godot enables both), so this costs nothing.
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

[preset.3]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="addons/gdUnit4/*, tests/*, tools/*, docs/*, *.md, reports/*, build/*, art/icon/boot_splash.png"
export_path="build/macos/golfVs.zip"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.3.options]

; A .zip rather than a .dmg or a bare .app: a .dmg can only be produced on
; macOS, and this has to build on a Linux runner like everything else.
export/distribution_type=0
binary_format/architecture="universal"
application/bundle_identifier="org.golfvs.test"
; Same provisional id as Android, and provisional for the same reason -- Open
; Question 1 is still the name, and DESIGN.md wants it settled by M4. `.test` is
; in it so this cannot be mistaken for the real thing.
application/short_version="0.0.3"
application/version="0.0.3"
application/copyright="Apache-2.0 (code), CC-BY-4.0 (art/audio)"
; Left empty on purpose: macOS is the one target that needs no icon wiring.
; Godot renders the .icns from the project icon, which is ours (ADR-025), so
; there is no equivalent here of the rcedit step Windows needs.
application/icon=""
display/high_res=true
; Unsigned and un-notarized. There is no Apple Developer identity, and buying
; one to ship a debug build would be deciding the release question sideways.
; Gatekeeper will quarantine the result; docs/RELEASE.md says how to open it.
codesign/enable=false
notarization/notarization=0
privacy/microphone_usage_description=""
privacy/camera_usage_description=""
ssh_remote_deploy/enabled=false

[preset.4]

name="Linux arm64"
platform="Linux"
; Not runnable: the editor's one-click deploy picks the first runnable preset per
; platform, and on every machine this project has that is the x86_64 one.
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; The Raspberry Pi 5 build. Same game, same exclusion (ADR-025), different chip.
; The templates package has carried Linux arm64 since 4.3, so this costs one
; preset and no new tooling, exactly as Linux x86_64 and macOS did (ADR-027).
exclude_filter="addons/gdUnit4/*, tests/*, tools/*, docs/*, *.md, reports/*, build/*, art/icon/boot_splash.png"
export_path="build/linux-arm64/golfVs.arm64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.4.options]

binary_format/embed_pck=false
; The Pi's VideoCore VII samples ETC2/ASTC natively and has no BC (S3TC/BPTC)
; support at all; hand it a BC-only pack and Godot decompresses every texture on
; the CPU at load. So this preset takes the Android side of the import that
; project.godot already produces, and the pack is *not* byte-identical to the
; x86_64 one -- build.yml's cmp is x86_64 Windows against x86_64 Linux only.
texture_format/s3tc_bptc=false
texture_format/etc2_astc=true
binary_format/architecture="arm64"
ssh_remote_deploy/enabled=false
