<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 512 512">
  <!--
    golfVs — the project icon.

    Drawn from the game rather than for it. Every colour here is a constant in
    `holes/hole_builder.gd`, and every shape is something the game actually
    draws: the deck grid of ADR-016's holodeck blueprint, the amber boundary the
    archer keeps, a target ring, the flight arc the club selector uses as a
    label, and the ball — the one lit solid object in a world of outlines.

    It replaces Godot's own logo, which had been the project icon since the
    repository was created. That was two problems in one file: it told anyone
    who saw it that the application *is* Godot, and the logo is the Godot
    Foundation's mark rather than this project's to use as product identity.

    **Balanced for 48 px, not for 256.** The first draft put the whole range in
    it and turned to mush on a launcher: the grid is texture, and texture is the
    first thing to go. So the grid is faint and sparse, the shot is thick, and
    the ball is large enough to survive being three pixels across. Everything
    stays clear of the edges, because a launcher will mask the corners off.

    No filters, no gradients. ThorVG renders this inside Godot; glow is faked
    the way the game fakes it, with a wide dim stroke under a narrow bright one.
  -->
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="104"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="104" fill="#05080c"/>

  <g clip-path="url(#tile)">
    <!-- The deck, receding to a vanishing point on the boundary itself. Faint:
         this is the thing being played on, not the thing being looked at. -->
    <g fill="none" stroke="#2a8fb0" stroke-width="3" opacity=".3">
      <path d="M256 214 -40 512M256 214 130 512M256 214 382 512M256 214 552 512"/>
    </g>
    <g fill="none" stroke="#2a8fb0" stroke-width="3" opacity=".22">
      <path d="M0 246h512M0 300h512M0 380h512M0 486h512"/>
    </g>

    <!-- The boundary, drawn where it actually is. Amber means "the course ends
         here", which is the one thing the archer of ADR-015 exists to enforce. -->
    <path d="M0 214h512" stroke="#ff7a2f" stroke-width="9" opacity=".9"/>

    <!-- A pin, as concentric rings. Gold is the cup. -->
    <g fill="none" stroke="#ffd46b">
      <ellipse cx="356" cy="352" rx="74" ry="26" stroke-width="6" opacity=".45"/>
      <ellipse cx="356" cy="352" rx="30" ry="11" stroke-width="8"/>
    </g>

    <!-- The shot. Wide and dim under narrow and bright: the same trick the
         beacons and the impact rings use to glow without a post-process. -->
    <path d="M136 418Q232 74 356 344" fill="none" stroke="#21d4ff"
          stroke-width="40" opacity=".14" stroke-linecap="round"/>
    <path d="M136 418Q232 74 356 344" fill="none" stroke="#21d4ff"
          stroke-width="15" stroke-linecap="round"/>

    <!-- The ball. The only filled, lit thing in the picture, which is exactly
         its job in ADR-016's blueprint: everything else is an outline. -->
    <circle cx="136" cy="418" r="62" fill="#21d4ff" opacity=".16"/>
    <circle cx="136" cy="418" r="44" fill="#9fd8e8" opacity=".4"/>
    <circle cx="136" cy="418" r="31" fill="#fdfdf6"/>
  </g>

  <rect width="512" height="512" rx="104" fill="none" stroke="#2a8fb0"
        stroke-width="6" opacity=".5"/>
</svg>
